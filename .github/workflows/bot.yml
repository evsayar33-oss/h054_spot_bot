name: h054-bot
on:
  schedule:
    - cron: '11 0,4,8,12,16,20 * * *'
    # Two independent delayed-schedule retries per 4h close; duplicate bars are idempotent.
    - cron: '11 1,5,9,13,17,21 * * *'
    - cron: '11 2,6,10,14,18,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: h054-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tests/test_bot.py
      - name: Run bot
        env:
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
        run: python -m bot.main
      - name: Commit state
        run: |
          git config user.name "h054-bot"; git config user.email "bot@users.noreply.github.com"
          git add state logs || true
          git diff --cached --quiet && exit 0
          git commit -m "bot run $(date -u +%FT%H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -X ours -q && git push -q && exit 0; sleep $((i*5)); done; exit 1
      - name: Verify latest closed 4h candle was processed
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p = Path("state/state.json")
          if not p.exists():
              sys.exit("H054_STATE_MISSING")
          state = json.loads(p.read_text())
          if state.get("approved") is not True:
              sys.exit("H054_APPROVAL_LOCKED: " + str(state.get("why")))
          bar = state.get("last_bar")
          if not bar:
              sys.exit("H054_LAST_BAR_MISSING")
          observed = datetime.fromisoformat(bar.replace("Z", "+00:00"))
          if observed.tzinfo is None:
              observed = observed.replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          expected = now.replace(hour=(now.hour // 4) * 4, minute=0, second=0, microsecond=0) - timedelta(hours=4)
          if observed < expected:
              sys.exit(f"H054_STALE_4H_BAR: last={observed.isoformat()} expected={expected.isoformat()}")
          print("H054_4H_CURRENT:", observed.isoformat())
          PY

name: Core safety CI
on:
  pull_request:
    paths:
      - 'bot/**'
      - 'tests/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/core_ci.yml'
  push:
    branches: ['main']
    paths:
      - 'bot/**'
      - 'tests/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/core_ci.yml'
permissions:
  contents: read
concurrency:
  group: core-safety-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile bot/*.py tests/test_superlab_gate.py
      - run: pytest -q tests/test_bot.py tests/test_superlab_gate.py

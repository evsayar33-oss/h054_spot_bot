name: Regime Band-30 — Bitget independent PAPER
on:
  pull_request:
    paths:
      - 'research/regime_band30/**'
      - '.github/workflows/regime_band30_paper.yml'
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [start, tick]
        default: start
  # Hourly checks reduce the risk of missing a 4h close when GitHub delays cron.
  # tick() deduplicates already processed candles; no synthetic PAPER fills.
  schedule:
    - cron: '25 * * * *'
  # Independent fallback: GitHub may delay or omit a scheduled run.
  # H054 is only a clock trigger; its orders/state never enter this PAPER ledger.
  workflow_run:
    workflows: ['h054-bot']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: regime-band30-paper-state
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s research/regime_band30 -p 'test_*.py' -v
      - run: python tests/test_bot.py
      - run: python -m unittest discover -s tests -p 'test_telegram_paper_report.py' -v
  paper:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Recover independent state (never touch production main)
        run: |
          mkdir -p results/regime_band30
          if git ls-remote --exit-code origin refs/heads/paper/regime-band30-bitget >/dev/null 2>&1; then
            git fetch origin refs/heads/paper/regime-band30-bitget:refs/remotes/origin/paper/regime-band30-bitget
            git show origin/paper/regime-band30-bitget:state.json > results/regime_band30/state.json
          fi
      - name: Read only Bitget spot paper observation
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'tick' }}
        run: python research/regime_band30/paper.py --mode "$MODE" --state results/regime_band30/state.json --out results/regime_band30/report
      - name: Notify Telegram of new PAPER observation or outage
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: python scripts/telegram_paper_report.py
      - name: Persist isolated ledger on orphan branch
        run: |
          if [ ! -s results/regime_band30/state.json ]; then exit 0; fi
          cp results/regime_band30/state.json /tmp/regime-band30-state.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/paper/regime-band30-bitget >/dev/null 2>&1; then
            git checkout -B paper/regime-band30-bitget origin/paper/regime-band30-bitget
          else
            git checkout --orphan paper/regime-band30-bitget
            git rm -rf . >/dev/null
          fi
          cp /tmp/regime-band30-state.json state.json
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regime Band-30 prospective paper observation'
            git push origin HEAD:refs/heads/paper/regime-band30-bitget
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regime-band30-bitget-paper-${{ github.run_id }}
          path: results/regime_band30/report/
          retention-days: 90
          if-no-files-found: warn
      - name: Reject green status when no valid market observation
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          p=Path("results/regime_band30/report/summary.json")
          if not p.exists():
              sys.exit("NO_PAPER_SUMMARY")
          d=json.loads(p.read_text())
          if d.get("new_gap_count", 0) > 0:
              sys.exit("PAPER_MISSED_OBSERVATIONS: " + str(d["new_gap_count"]))
          if d.get("lag_bars") is None or d["lag_bars"] > 0:
              sys.exit("PAPER_STALE_CANDLE: " + str(d.get("lag_bars")))
          if d.get("healthy"):
              print("PAPER_HEALTHY: observations",d["observations"],"trades",d["trades"])
          elif d.get("last_error") is None and d.get("observations",0)>0:
              # An early manual tick can legitimately see the same last closed
              # candle. The ledger is unchanged and there is no new outage.
              print("PAPER_NO_NEW_CANDLE: last observation retained; no new error")
          else:
              sys.exit("PAPER_UNHEALTHY: " + str(d.get("last_error")))
          PY

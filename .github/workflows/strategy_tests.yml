name: H054 Strategy Regression (no orders)
on:
  pull_request:
    paths:
      - 'bot/signal.py'
      - 'config.yaml'
      - 'tests/**'
      - '.github/workflows/strategy_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run H054 legacy parity and MOM2 regressions (offline only)
        run: python tests/test_bot.py
